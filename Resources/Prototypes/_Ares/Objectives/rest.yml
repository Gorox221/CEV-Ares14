- type: entity
  parent: BaseObjective
  id: DesireEatObjective
  components:
  - type: Objective
    icon:
      sprite: Objects/Consumable/Food/burger.rsi
      state: plain
    difficulty: 0.1
    issuer: objective-issuer-desires
  - type: DesireCondition
    desireType: Eat

- type: entity
  parent: BaseObjective
  id: DesireDrinkObjective
  components:
  - type: Objective
    icon:
      sprite: Objects/Consumable/Drinks/beer.rsi
      state: icon
    difficulty: 0.1
    issuer: objective-issuer-desires
  - type: DesireCondition
    desireType: Drink

- type: entity
  parent: BaseObjective
  id: DesireSmokeObjective
  components:
  - type: Objective
    icon:
      sprite: Objects/Consumable/Smokeables/Cigarettes/cigarette.rsi
      state: unlit-icon
    difficulty: 0.1
    issuer: objective-issuer-desires
  - type: DesireCondition
    desireType: Smoke
