- type: perk
  id: OddityStrangeBlessing
  name: perk-oddity-strange-blessing-name
  description: perk-oddity-strange-blessing-desc
  roundStartSelectable: false
  isOddity: true
  effects:
  - !type:StatDeltaPerkEffect
    deltas:
      Vigilance: 3
      Cognition: 3
