- type: entity
  parent: BaseItem
  id: BaseDepartmentBudgetCard
  categories: [ HideSpawnMenu ]
  components:
    - type: BankCard
      commandBudgetCard: true
    - type: Sprite
      sprite: _ADT/Objects/Misc/cards.rsi
      scale: 0.8, 0.8
      state: budgetcard
    - type: Item
      storedRotation: 90

- type: entity
  parent: BaseDepartmentBudgetCard
  id: CommandBudgetCard
  name: budget card
  suffix: Station
  components:
    - type: Sprite
      state: budgetcard
    - type: BankCard
      commandBudgetType: Cargo

- type: entity
  parent: Paper
  id: CommandBudgetPinPaper
  name: budget pin
  suffix: Station
  components:
  - type: CommandBudgetPinPaper
    commandBudgetType: Cargo
  - type: Paper

